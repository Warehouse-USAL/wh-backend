name: Pre-release

on:
  push:
    branches:
      - 'beta/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Build and publish pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive pre-release tag
        id: tag
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" == beta/* ]]; then
            SERIES="${BRANCH#beta/}"
            EXISTING=$(git tag -l "beta-${SERIES}-*" | sort -V | tail -1)
            if [ -z "$EXISTING" ]; then
              N=1
            else
              LAST_N="${EXISTING##*-}"
              N=$((LAST_N + 1))
            fi
            TAG="beta-${SERIES}-${N}"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            VERSION="${BRANCH#hotfix/}"
            EXISTING=$(git tag -l "hotfix-${VERSION}-*" | sort -V | tail -1)
            if [ -z "$EXISTING" ]; then
              N=1
            else
              LAST_N="${EXISTING##*-}"
              N=$((LAST_N + 1))
            fi
            TAG="hotfix-${VERSION}-${N}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Pre-release tag: $TAG"

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wh-backend"
          docker build -t "${IMAGE}:${{ steps.tag.outputs.tag }}" .
          docker push "${IMAGE}:${{ steps.tag.outputs.tag }}"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pre-release ${{ steps.tag.outputs.tag }}
          prerelease: true
          files: build/libs/*.jar
          generate_release_notes: true
