name: CI

on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-drafts:
    name: Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Not a draft
        run: echo "PR is ready for review — proceeding with CI"

  validate-branch:
    name: Validate branch model
    needs: skip-drafts
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          if ! echo "$BRANCH" | grep -qE '^(feature|fix|enhancement|refactor|hotfix|beta|backport|dependabot)/'; then
            echo "ERROR: Branch '$BRANCH' does not match naming conventions."
            echo "Expected prefix: feature/, fix/, enhancement/, refactor/, hotfix/, beta/, backport/, dependabot/"
            exit 1
          fi
          echo "Branch name is valid."

      - name: Enforce GitFlow flow (which branches may target which)
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "Flow: $HEAD -> $BASE"
          # master (production) is only updated through the release process:
          #   beta/*  (release candidate) or hotfix/* (production urgency).
          if [ "$BASE" = "master" ]; then
            case "$HEAD" in
              beta/*|hotfix/*) echo "OK: release path into master." ;;
              *) echo "ERROR: only beta/* or hotfix/* may target master. Day-to-day work (feature/enhancement/fix) goes to develop."; exit 1 ;;
            esac
          # develop receives all day-to-day work plus automated PRs.
          elif [ "$BASE" = "develop" ]; then
            case "$HEAD" in
              feature/*|enhancement/*|fix/*|refactor/*|hotfix/*|backport/*|dependabot/*) echo "OK: into develop." ;;
              *) echo "ERROR: '$HEAD' may not target develop."; exit 1 ;;
            esac
          fi

  # Which components this PR touches (scripts/ci-changes.sh); the jobs below run only for those.
  changes:
    name: Detect changed components
    needs: skip-drafts
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      bridge: ${{ steps.changes.outputs.bridge }}
      console: ${{ steps.changes.outputs.console }}
      platform: ${{ steps.changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: scripts/ci-changes.sh

  code-quality:
    name: Code Quality (Checkstyle + SpotBugs)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain
        working-directory: backend

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain
        working-directory: backend

  test-coverage:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: backend

      - name: Diff coverage (changed lines >= 90%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          pipx run --spec diff-cover==10.6.0 diff-cover
          backend/build/reports/jacoco/test/jacocoTestReport.xml
          --src-roots backend/src/main/java
          --compare-branch="origin/$BASE_REF" --fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/build/reports/jacoco/test/html/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/test/

  bridge:
    name: Bridge (Go vet + tests)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Coverage (./internal/... without fakeinfra >= 90%)
        working-directory: .
        run: scripts/go-coverage.sh bridge 90

      - name: Diff coverage (changed lines >= 90%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          go run github.com/boumenot/gocover-cobertura@v1.5.0 <coverage.out >coverage.xml
          cd .. && pipx run --spec diff-cover==10.6.0 diff-cover bridge/coverage.xml \
            --compare-branch="origin/$BASE_REF" --fail-under=90

  console:
    name: Console (lint + typecheck + tests + build)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node version
        id: node
        run: echo "version=$(cat .nvmrc 2>/dev/null || echo 22)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds (90%) live in console/vite.config.ts.
      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Diff coverage (changed lines >= 90%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f coverage/cobertura-coverage.xml ]; then
            echo "::error::console/coverage/cobertura-coverage.xml missing (enable Vitest's cobertura reporter in console/vite.config.ts)"
            exit 1
          fi
          cd .. && pipx run --spec diff-cover==10.6.0 diff-cover console/coverage/cobertura-coverage.xml \
            --compare-branch="origin/$BASE_REF" --fail-under=90

  # Compose files, collector configs, shell scripts and the CI scripts' own tests.
  compose:
    name: Platform (compose + collector + scripts)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    env:
      # Dummy values for the variables .env.example leaves out.
      MONGO_ROOT_USER: ci
      MONGO_ROOT_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Compose config (dev, dev + prod)
        run: |
          docker compose --env-file .env.example --profile dev config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Collector config validate (dev, dev + prod)
        run: |
          IMAGE=$(docker compose --env-file .env.example config --format json | jq -r '.services["otel-collector"].image')
          echo "collector image: $IMAGE"
          docker run --rm -v "$PWD/config/otel:/etc/otel:ro" "$IMAGE" validate \
            --config=/etc/otel/collector-config.yml
          docker run --rm -v "$PWD/config/otel:/etc/otel:ro" "$IMAGE" validate \
            --config=/etc/otel/collector-config.yml --config=/etc/otel/collector-config.prod.yml

      - name: Shell scripts (syntax + shellcheck)
        run: |
          for f in scripts/*.sh config/restock-cron/*.sh e2e/*.sh; do
            case $(head -1 "$f") in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done
          shellcheck -S error scripts/*.sh config/restock-cron/*.sh e2e/*.sh
          shellcheck scripts/ci-changes.sh scripts/ci-changes.test.sh scripts/go-coverage.sh scripts/go-coverage.test.sh

      - name: CI script tests
        run: |
          sh scripts/ci-changes.test.sh
          sh scripts/go-coverage.test.sh

  # The whole console stack in Docker, asserted over HTTP through the console's nginx, push stream
  # included (scripts/console-smoke.sh, docs/CONSOLE.md "Smoke test"). Any component can break it.
  console-smoke:
    name: Console smoke (stack over HTTP)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.bridge == 'true' ||
      needs.changes.outputs.console == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_PROJECT: whsmoke
    steps:
      - uses: actions/checkout@v4

      - name: Smoke helper tests (no Docker)
        run: bash scripts/console-smoke.test.sh

      # BuildKit layer cache for backend, bridge and console in the Actions cache
      # (scripts/console-smoke.ci.yml): a run without Dockerfile or dependency changes skips the
      # Gradle, Go module and npm downloads. Pulled images come from the registries as usual.
      - uses: docker/setup-buildx-action@v3

      - name: Expose the Actions cache to BuildKit
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Smoke
        env:
          SMOKE_EXTRA_COMPOSE: scripts/console-smoke.ci.yml
        run: scripts/console-smoke.sh --keep

      - name: Compose logs
        if: failure()
        run: |
          docker compose -p "$SMOKE_PROJECT" -f docker-compose.yml -f scripts/console-smoke.compose.yml \
            --profile infra --profile dev ps -a
          docker compose -p "$SMOKE_PROJECT" -f docker-compose.yml -f scripts/console-smoke.compose.yml \
            --profile infra --profile dev logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: |
          docker compose -p "$SMOKE_PROJECT" -f docker-compose.yml -f scripts/console-smoke.compose.yml \
            --profile infra --profile dev down -v --remove-orphans

  build:
    name: Build JAR
    needs: [changes, code-quality, test-coverage]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Build JAR
        run: ./gradlew bootJar
        working-directory: backend

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: wh-backend-jar
          path: backend/build/libs/*.jar

  # The only required status check: green when every job above passed or was skipped (paths
  # untouched), red when any failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [skip-drafts, validate-branch, changes, code-quality, test-coverage, bridge, console, compose, console-smoke, build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          OUTPUTS: >-
            backend=${{ needs.changes.outputs.backend }}
            bridge=${{ needs.changes.outputs.bridge }}
            console=${{ needs.changes.outputs.console }}
            platform=${{ needs.changes.outputs.platform }}
        run: |
          echo "results: $RESULTS"
          if [ "$CHANGES" = success ]; then
            for o in $OUTPUTS; do
              case $o in
                *=) echo "::error::changes job succeeded but output '${o%=}' is empty"; exit 1 ;;
              esac
            done
          fi
          for r in $RESULTS; do
            case $r in
              failure|cancelled) echo "a required job ended in '$r'"; exit 1 ;;
            esac
          done
