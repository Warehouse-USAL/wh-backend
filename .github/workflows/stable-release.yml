name: Stable Release

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  stable-release:
    name: Publish stable release
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'beta/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive stable version tag
        id: tag
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" == beta/* ]]; then
            VERSION="${BRANCH#beta/}"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            VERSION="${BRANCH#hotfix/}"
          fi
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Stable version: v${VERSION}"

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/wh-backend:${{ steps.tag.outputs.version }} \
                       -t ghcr.io/${{ github.repository_owner }}/wh-backend:latest .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/wh-backend:${{ steps.tag.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/wh-backend:latest

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.version }}
          git push origin ${{ steps.tag.outputs.version }}

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          prerelease: false
          files: build/libs/*.jar
          generate_release_notes: true

  trigger-backport:
    name: Trigger backport to develop
    needs: stable-release
    uses: ./.github/workflows/backport.yml
    with:
      version: ${{ needs.stable-release.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
