# Console: the SPA at /console/ and the backend at /api/ (prefix stripped), same origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The raw request URI without /api, so encoding and the query string reach the backend untouched.
map $request_uri $backend_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default             /;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Relative Location headers keep the client's host and port (8083 in dev, Caddy in prod).
    absolute_redirect off;

    # Docker's DNS; resolving per request lets nginx start (and answer 502) while the backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / {
        return 302 /console/;
    }

    location = /console {
        return 301 /console/;
    }

    # Hashed build output: cache for a year, never fall back to the HTML.
    location /console/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    location /console/ {
        root /usr/share/nginx/html;
        try_files $uri /console/index.html;
        expires -1;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$backend_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Long enough for idle WebSocket feeds.
        proxy_read_timeout 1h;
        # Matches the backend's multipart limit (spring.servlet.multipart.max-request-size).
        client_max_body_size 10m;
    }
}
