# Console: the SPA at /console/ and the backend at /api/ (prefix stripped), same origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind Caddy in prod: keep the scheme the client used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The raw request URI without /api, so encoding and the query string reach the backend untouched.
map $request_uri $backend_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default             /;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Relative Location headers keep the client's host and port (8083 in dev, Caddy in prod).
    absolute_redirect off;

    # Docker's DNS; resolving per request lets nginx start (and answer 502) while the backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inline styles: React style props and coss ui. Frames: the dev-tools proxies on the same host.
    set $csp "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' http://*:8091 http://*:8092; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";

    # Repeated in every location that sets its own add_header (nginx does not merge them).
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / {
        return 302 /console/;
    }

    location = /console {
        return 301 /console/;
    }

    # Hashed build output: cache for a year, never fall back to the HTML.
    location /console/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location /console/ {
        root /usr/share/nginx/html;
        try_files $uri /console/index.html;
        expires -1;
    }

    # The console's push stream (Server-Sent Events, docs/CONSOLE.md): every frame and `: ping` must
    # reach the browser as it is written, so nothing buffers, caches or compresses it, and the
    # connection stays open while the token lives. It sets no add_header, so the server's security
    # headers above still apply (nginx only drops them in a location that adds its own).
    location = /api/console/stream {
        set $backend http://backend:8080;
        proxy_pass $backend$backend_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Far above the 15 s heartbeat; the backend ends the stream when the token expires.
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$backend_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Long enough for idle WebSocket feeds.
        proxy_read_timeout 1h;
        # Matches the backend's multipart limit (spring.servlet.multipart.max-request-size).
        client_max_body_size 10m;
    }
}
