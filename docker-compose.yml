services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_MONGODB_URI: mongodb://mongodb:27017/smartwarehouse
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: dev-secret-change-in-prod-min-32-chars
      JWT_EXPIRATION_MS: 86400000
      SPRING_PROFILES_ACTIVE: dev,docker
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wh-images}
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wh-network
    restart: unless-stopped

  mongodb:
    # Pinned to 4.4 — the last MongoDB line that runs WITHOUT AVX. The prod box
    # (HP ProLiant, no AVX) crashes mongo:5.0+ with "Illegal instruction". 4.4 is
    # a verified functional drop-in for our usage (replica set, transactions, the
    # ProductService aggregation) — see scripts/smoke-mongo.sh. Revisit before any
    # public exposure: 4.4 is EOL.
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - wh-network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # 4.4 ships the legacy 'mongo' shell, not 'mongosh'. Also, on that shell
      # rs.status() RETURNS {ok:0} on an uninitialised node (mongosh throws), so we
      # test the .ok value rather than rely on a catch. Reports healthy only once
      # the node is PRIMARY, so dependents wait for a usable replica set.
      test: |
        mongo --quiet --eval '
          var s; try { s = rs.status().ok } catch (e) { s = 0 }
          if (s !== 1) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}); quit(1) }
          quit(rs.status().myState === 1 ? 0 : 1)
        '
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wh-network
    profiles:
      - dev
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    networks:
      - wh-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    ports:
      - "8082:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    entrypoint: /bin/sh
    command: -c 'printf "kafka:\n  brokers:\n    - redpanda:9092\n" > /tmp/config.yml && /app/console'
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - wh-network
    profiles:
      - dev
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./data/minio:/data
    networks:
      - wh-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  wh-network:
    driver: bridge
