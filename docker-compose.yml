services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_MONGODB_URI: mongodb://mongodb:27017/smartwarehouse
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: dev-secret-change-in-prod-min-32-chars
      JWT_EXPIRATION_MS: 86400000
      SPRING_PROFILES_ACTIVE: dev,docker
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Set SEED_DEMO=true against a FRESH database to seed a full, interconnected
      # demo dataset on first boot (idempotent; off by default). The prod overlay
      # inherits this var. See docs/demo-credentials.md.
      SEED_DEMO: ${SEED_DEMO:-false}
      # Text prefix of the QR code seeded on every position (WH2|PA1..PA3, WH2|PM1..PM3); read on that first boot
      # only. Must match the codes printed in the warehouse (docs/OPERATIONS.md).
      WH_QR_PREFIX: ${WH_QR_PREFIX:-WH2|}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wh-images}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/metrics
      TELEMETRY_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      # Tomcat's ThreadPool MBean feeds the tomcat.threads/tomcat.connections gauges.
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      # Read side of the logs pipeline (the console's Logs page).
      CONSOLE_VICTORIALOGS_URL: http://victorialogs:9428
      # Shared secret the bridge sends in X-Api-Key on /infra/**. Blank = those endpoints reject everything.
      INFRA_API_KEY: ${INFRA_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wh-network
    restart: unless-stopped

  # Temporary translator between Infra's RabbitMQ world and this backend (see bridge/README.md).
  # Opt-in: `docker compose --profile infra up`. Needs INFRA_AMQP_URL and INFRA_API_KEY (the bridge exits at startup if either is empty).
  bridge:
    build: ./bridge
    environment:
      KAFKA_BROKERS: redpanda:9092
      AMQP_URL: ${INFRA_AMQP_URL:-}
      BACKEND_URL: http://backend:8080
      INFRA_API_KEY: ${INFRA_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redpanda:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - wh-network
    profiles:
      - infra
    restart: unless-stopped

  # Recommendations service (docs/SUGGESTIONS.md): consumes `order.completed` from Redpanda into its own
  # Redis and serves JWT-protected HTTP on :8084. Opt-in: `docker compose --profile suggestions up`.
  suggestions:
    build: ./suggestions
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: suggestions-redis:6379
      # Same secret the backend signs its JWTs with.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod-min-32-chars}
    ports:
      - "8084:8080"
    depends_on:
      redpanda:
        condition: service_healthy
      suggestions-redis:
        condition: service_healthy
    networks:
      - wh-network
    profiles:
      - suggestions
    restart: unless-stopped

  # The suggestions model lives only here, so it is persisted with AOF (appendonly yes).
  suggestions-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/suggestions-redis:/data
    networks:
      - wh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - suggestions
    restart: unless-stopped

  mongodb:
    # Pinned to 4.4 — the last MongoDB line that runs WITHOUT AVX. The prod box
    # (HP ProLiant, no AVX) crashes mongo:5.0+ with "Illegal instruction". 4.4 is
    # a verified functional drop-in for our usage (replica set, transactions, the
    # ProductService aggregation) — see scripts/smoke-mongo.sh. Revisit before any
    # public exposure: 4.4 is EOL.
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - wh-network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # 4.4 ships the legacy 'mongo' shell, not 'mongosh'. Also, on that shell
      # rs.status() RETURNS {ok:0} on an uninitialised node (mongosh throws), so we
      # test the .ok value rather than rely on a catch. Reports healthy only once
      # the node is PRIMARY, so dependents wait for a usable replica set.
      test: |
        mongo --quiet --eval '
          var s; try { s = rs.status().ok } catch (e) { s = 0 }
          if (s !== 1) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}); quit(1) }
          quit(rs.status().myState === 1 ? 0 : 1)
        '
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wh-network
    profiles:
      - dev
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    networks:
      - wh-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    ports:
      - "8082:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    entrypoint: /bin/sh
    command: -c 'printf "kafka:\n  brokers:\n    - redpanda:9092\n" > /tmp/config.yml && /app/console'
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - wh-network
    profiles:
      - dev
    restart: unless-stopped

  minio:
    # minio/minio is no longer published (Docker Hub, quay.io and ghcr all refuse anonymous pulls). Chainguard's
    # maintained MinIO server build keeps the same entrypoint, env, data format and `mc` for the
    # healthcheck; its free tier only tags `latest`, so the digest is the pin. Reads data written
    # by earlier MinIO releases — a one-way upgrade: do not roll the binary back afterwards.
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    # Runs as uid 65532 by default; existing volumes and bind mounts are root-owned.
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # Lets the collector scrape /minio/v2/metrics/cluster without a bearer token. Anyone who
      # reaches port 9000 can read those metrics too (counts and sizes, no object data).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ./data/minio:/data
    networks:
      - wh-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    command:
      # Was 30d, then 400d. The demo seed now backfills two years of fleet history
      # (DemoTelemetrySeeder) so dashboards can chart year-over-year — a shorter retention would
      # silently evict the oldest year right after seeding it. 800d leaves margin past 730.
      - "-retentionPeriod=800d"
      - "-httpListenAddr=:8428"
      # Without this VM sizes its caches at -memory.allowedPercent=60 of host RAM (~5GB on a
      # dev laptop). The prod box is a shared HP ProLiant already running five containers, so
      # the footprint is pinned rather than left to scale with whatever machine it lands on.
      - "-memory.allowedBytes=512MB"
    ports:
      - "8428:8428"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data
    networks:
      - wh-network
    # No healthcheck: the image ships without a shell or any HTTP client, so every CMD form
    # fails regardless of whether the server is up. The collector's remote-write queue retries,
    # so service_started is sufficient for ordering.
    restart: unless-stopped

  # The telemetry broker. Distroless image, so no shell healthcheck is possible; the
  # backend deliberately does NOT depend on it — telemetry must degrade, never block startup.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/collector-config.yml"]
    volumes:
      - ./config/otel/collector-config.yml:/etc/otel/collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
    networks:
      - wh-network
    restart: unless-stopped

  # Log store behind the console's Logs page: the collector ships OTLP logs here. Internal only,
  # like the other stores in prod. Same image constraints as victoriametrics (no shell, so no
  # healthcheck) and the same pinned memory budget reasoning.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:9428"
      - "-storageDataPath=/victoria-logs-data"
      - "-memory.allowedBytes=256MB"
    volumes:
      - victorialogs_data:/victoria-logs-data
    networks:
      - wh-network
    restart: unless-stopped

  # SUPERADMIN backend console (console/, served at /console/). Its nginx proxies /api to the backend.
  console:
    build: ./console
    ports:
      - "8083:80"
      # Frame-safe proxies to mongo-express and redpanda-console (dev profile) for the Dev tools pages.
      - "8091:8091"
      - "8092:8092"
    volumes:
      - ./console/nginx.dev-tools.conf:/etc/nginx/conf.d/dev-tools.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - wh-network
    # nginx itself (the SPA), not the backend behind /api: nginx answers 502 there while it boots.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/console/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The daily restock run (docs/RFC_Metricas_Calculadas.md). Calls the backend's
  # POST /metrics/restock-suggestions/apply, which stores each product's recommendation on the
  # product. The business params live here, not in the backend: change one in .env and run
  # `docker compose up -d restock-cron` — only this container is recreated. Stateless.
  restock-cron:
    image: curlimages/curl:8.11.1
    # busybox crond needs root to run jobs; the container only ever runs curl.
    user: root
    entrypoint: ["/bin/sh", "/opt/restock-cron/restock-cron.sh", "entrypoint"]
    environment:
      RESTOCK_BACKEND_URL: ${RESTOCK_BACKEND_URL:-http://backend:8080}
      # Defaults to the bootstrap SUPERADMIN, which always exists. Prefer a dedicated
      # ADMIN_WAREHOUSE account: set RESTOCK_USER / RESTOCK_PASSWORD.
      RESTOCK_USER: ${RESTOCK_USER:-${ADMIN_EMAIL:-admin@smartwarehouse.local}}
      RESTOCK_PASSWORD: ${RESTOCK_PASSWORD:-${ADMIN_PASSWORD:-}}
      # Evaluated in UTC: 06:00 UTC is 03:00 in Buenos Aires / Montevideo.
      RESTOCK_SCHEDULE: ${RESTOCK_SCHEDULE:-0 6 * * *}
      RESTOCK_ALPHA: ${RESTOCK_ALPHA:-0.3}
      RESTOCK_RECENT_DAYS: ${RESTOCK_RECENT_DAYS:-7}
      RESTOCK_LONG_DAYS: ${RESTOCK_LONG_DAYS:-60}
      RESTOCK_SAFETY_DAYS: ${RESTOCK_SAFETY_DAYS:-2}
      RESTOCK_LEAD_TIME_DAYS: ${RESTOCK_LEAD_TIME_DAYS:-5}
      RESTOCK_COVERAGE_DAYS: ${RESTOCK_COVERAGE_DAYS:-7}
      # Runs once at start (retrying while the backend boots) so product.restock is never
      # empty after a deploy or a fresh seed.
      RESTOCK_RUN_ON_START: ${RESTOCK_RUN_ON_START:-true}
      # Seconds to wait for backend readiness per run, and first-run attempts on transient errors.
      RESTOCK_READY_TIMEOUT: ${RESTOCK_READY_TIMEOUT:-900}
      RESTOCK_STARTUP_RETRIES: ${RESTOCK_STARTUP_RETRIES:-60}
      # Where each run pushes its job.run gauge (OTLP/JSON). Blank = no push. Never fails a run.
      RESTOCK_OTLP_URL: ${RESTOCK_OTLP_URL:-http://otel-collector:4318/v1/metrics}
    volumes:
      - ./config/restock-cron/restock-cron.sh:/opt/restock-cron/restock-cron.sh:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - wh-network
    restart: unless-stopped

networks:
  wh-network:
    driver: bridge

volumes:
  victorialogs_data:
