# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#  - backend runs the prebuilt GHCR image and joins the shared reverse-proxy net
#  - MongoDB runs a replica set WITH auth, which requires a keyFile; the keyfile
#    is generated once into a named volume, and a one-shot initializer runs
#    rs.initiate() authenticated as root (the dev healthcheck can't, once auth is on)
#  - stateful data lives in named volumes (no host bind-mount permission issues)
#  - backend, bridge, console and suggestions run the GHCR images of one release: WH_IMAGE_TAG (default latest)
#    pins all four, e.g. WH_IMAGE_TAG=v1.4.0 to roll back (docs/CONSOLE.md, Rollback)
#  - secrets have no defaults here: compose refuses to start when one is missing

# json-file rotation for the services the console added (the Docker daemon default never rotates).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/warehouse-usal/wh-backend:${WH_IMAGE_TAG:-latest}
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:?set SPRING_DATA_MONGODB_URI in .env}
      # Override the dev base's credential-less SPRING_MONGODB_URI so prod doesn't
      # connect unauthenticated.
      SPRING_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:?set SPRING_DATA_MONGODB_URI in .env}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS}
      # Redpanda is Kafka-compatible; the prod profile binds spring.kafka.bootstrap-servers.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      # Signs every JWT, console sessions included: the dev base's literal must never reach prod.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SPRING_PROFILES_ACTIVE: prod
      # Honor X-Forwarded-* (incl. X-Forwarded-Prefix from Caddy) so swagger/api-docs
      # URLs are generated with the public /api prefix instead of root.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # The 'prod' profile doesn't load application-docker.yml, so MinIO endpoint/
      # bucket aren't set there — provide them explicitly (MinioConfig requires them).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-wh-images}
      # The 'prod' profile does not load application-docker.yml, so this must be set explicitly
      # here or declared indexes are never created and every filtered query scans.
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:-true}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      TELEMETRY_LOGS_ENDPOINT: ${TELEMETRY_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      # Tomcat's ThreadPool MBean feeds the tomcat.threads/tomcat.connections gauges.
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
      VICTORIAMETRICS_URL: ${VICTORIAMETRICS_URL:-http://victoriametrics:8428}
      CONSOLE_VICTORIALOGS_URL: ${CONSOLE_VICTORIALOGS_URL:-http://victorialogs:9428}
      INFRA_API_KEY: ${INFRA_API_KEY:-}
    restart: always
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wh-network
      - wh-proxy

  # Translator between Infra's RabbitMQ and the backend (see bridge/README.md). It is opt-in in dev
  # (profile `infra`); in prod it always runs. INFRA_AMQP_URL and INFRA_API_KEY come from the
  # server's .env — the bridge exits at startup if either is empty.
  bridge:
    image: ghcr.io/warehouse-usal/wh-bridge:${WH_IMAGE_TAG:-latest}
    environment:
      KAFKA_BROKERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      AMQP_URL: ${INFRA_AMQP_URL:-}
      BACKEND_URL: http://backend:8080
      INFRA_API_KEY: ${INFRA_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    profiles: !reset []
    restart: always

  # Recommendations service (docs/SUGGESTIONS.md). Caddy already routes /suggestions/* (prefix
  # stripped) to suggestions:8080, hence the wh-proxy network and the exact service name.
  # JWT_SECRET is the backend's: tokens are verified locally, never sent anywhere.
  suggestions:
    image: ghcr.io/warehouse-usal/wh-suggestions:${WH_IMAGE_TAG:-latest}
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      REDIS_ADDR: suggestions-redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 chars)}
    ports: !override []
    profiles: !reset []
    depends_on:
      redpanda:
        condition: service_healthy
      suggestions-redis:
        condition: service_healthy
    restart: always
    logging: *logging
    networks:
      - wh-network
      - wh-proxy

  # AOF on a named volume: the model is rebuilt from Kafka only as far as retention allows.
  suggestions-redis:
    volumes: !override
      - suggestions_redis_data:/data
    profiles: !reset []
    restart: always
    logging: *logging

  # One-shot: create the replica-set keyFile in a named volume if absent.
  # All mongo images pinned to 4.4 — the prod box (HP ProLiant) has no AVX, so
  # mongo:5.0+ crashes with "Illegal instruction". 4.4 supports keyFile+auth+replSet.
  mongo-keyfile:
    image: mongo:4.4
    entrypoint:
      - bash
      - -c
      - 'test -f /keyfile/mongo.key || { openssl rand -base64 756 > /keyfile/mongo.key && chmod 400 /keyfile/mongo.key && chown 999:999 /keyfile/mongo.key; }'
    volumes:
      - mongo_keyfile:/keyfile
    restart: "no"

  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/mongo.key", "--auth"]
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    # Liveness only (ping is allowed pre-auth); replica-set init is handled below.
    # 4.4 ships the legacy 'mongo' shell, not 'mongosh'.
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: always

  # One-shot: initiate the replica set, authenticated as root. Idempotent.
  mongo-init:
    image: mongo:4.4
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        mongo --host mongodb:27017 --quiet \
          -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
          --eval 'var s; try { s = rs.status().ok } catch (e) { s = 0 } if (s !== 1) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }'
    networks:
      - wh-network
    restart: "no"

  redpanda:
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: always

  minio:
    volumes:
      - minio_data:/data
    restart: always

  # Named volume rather than a host bind-mount, matching mongodb/minio in this overlay.
  # Host port publishing from the dev base is cleared: unlike the databases, nothing off-box
  # has any reason to reach these two. They stay reachable only on wh-network, never via Caddy.
  victoriametrics:
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    ports: !override []

  # Joins wh-proxy to scrape Caddy's metrics (collector-config.prod.yml adds that job). Accepted
  # risk: OTLP (4317/4318) and health (13133) listen on 0.0.0.0, so any container on the shared
  # proxy network can also write metrics and logs into the stores (docs/CONSOLE.md).
  otel-collector:
    command: ["--config=/etc/otel/collector-config.yml", "--config=/etc/otel/collector-config.prod.yml"]
    # Until Caddy serves its metrics this logs one scrape warning a minute.
    logging: *logging
    volumes:
      - ./config/otel/collector-config.prod.yml:/etc/otel/collector-config.prod.yml:ro
    ports: !override []
    networks:
      - wh-network
      - wh-proxy

  victorialogs:
    restart: always
    logging: *logging

  # Prebuilt GHCR image; reached through Caddy at /console/ (docs/CONSOLE.md), so no host port.
  console:
    image: ghcr.io/warehouse-usal/wh-console:${WH_IMAGE_TAG:-latest}
    ports: !override []
    # No dev-tools proxies in prod.
    volumes: !reset []
    restart: always
    logging: *logging
    networks:
      - wh-network
      - wh-proxy

  restock-cron:
    restart: always
    logging: *logging

networks:
  wh-network:
    driver: bridge
  wh-proxy:
    external: true

volumes:
  mongo_data:
  mongo_keyfile:
  redpanda_data:
  minio_data:
  victoriametrics_data:
  suggestions_redis_data:
