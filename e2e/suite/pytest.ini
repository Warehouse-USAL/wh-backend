[pytest]
addopts = -ra --tb=short --junitxml=/results/junit.xml -o junit_family=xunit2 -p no:cacheprovider -m "not multi"
timeout = 180
testpaths = .
python_files = test_*.py
markers =
    flow: needs the fake Infra running (real backend -> bridge -> Infra -> backend loop); runs in its own group
    resilience: stops/starts infrastructure containers; slow and destructive, runs last
    multi: needs two backend instances (e2e/multi.sh, make e2e-multi); excluded from the default suite
    known_failure(reason, bug=None): a confirmed PRODUCT bug; the test keeps asserting the correct behaviour and is expected to fail (strict: it must be removed once the bug is fixed)
